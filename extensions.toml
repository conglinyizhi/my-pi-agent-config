# ═══════════════════════════════════════════════════════════
# extensions.toml — pi 扩展集中配置
# ═══════════════════════════════════════════════════════════
#
# 用途：扩展自己的配置统一放这里，每个扩展一个 [section]。
# 本文件不进 LLM 上下文；由各扩展在初始化/调用时自行读取。
#
# 背景：扩展配置曾散落在 settings.json（换模型时被误改，很脏）与
# 各扩展目录（tools.toml / sandbox-blacklist.json / providers.roles.toml 等）。
# 本文件作为集中入口，后续同类配置可逐步并入对应 section。
#
# 注意：providers.toml（含凭据）、settings.json（pi 核心）、
# auth.json、缓存类文件（models-store.json / mcp-cache.json）不并入。

# ─────────────────────────────────────────────────────────────
# sandbox-permissions：敏感路径黑名单（原 sandbox-blacklist.json）
# 防恶意 skill 诱导模型读取敏感文件（浏览器密码/钱包密钥/API key）并外传
#
# 读 / 写 / 普通 bash / worker bash 命中即拒；唯一例外是 sandbox-allow 升权工具：
# 它会把命中转成人工审批（并在窗口里标出命中的那一段），而不是直接拒。
# 理由：.env 这类项目配置常被误伤，而升权工具本来就是让人对越界操作拍板的地方；
# 但它仍不能静默放行。细节见 extensions/sandbox-permissions/README.md
# ─────────────────────────────────────────────────────────────
[sandbox-guard]
blacklist = [
  "~/.ssh/**",
  "~/.aws/**",
  "~/.gnupg/**",
  "~/.config/gh/**",
  "~/.config/google-chrome/**",
  "~/.config/chromium/**",
  "~/.config/microsoft-edge/**",
  "~/.config/BraveSoftware/**",
  "~/.mozilla/**",
  "~/.npmrc",
  "~/.bash_history",
  "~/.zsh_history",
  "~/.pi/agent/auth.json",
  "~/.pi/agent/providers.toml",
  "~/.pi/agent/mcp-cache.json",
  ".env",
  ".env.local",
  "**/.env",
  "**/.env.local",
]

# ─────────────────────────────────────────────────────────────
# subagent 模型：不再从配置文件决定，直接复用当前会话模型（ctx.model）。
# 旧的角色路由（subagent-roles / providers.roles.toml）已废弃：oc 是原三叉戟
# 主代理角色的旧设定，已移除；subagent 只有一种（worker），无角色区分。
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# tool-checker：外部 CLI 工具检测（原 extensions/tool-checker/tools.toml）
# 每个 [[tool-checker.tools]] 块定义一个工具：
#   name - 唯一标识；display - 状态栏短名；check - 检测命令（支持管道）
#   version - 可选，正则，capture group 1 提取版本号
#   auth - 可选，鉴权命令，返回码 0 = 已鉴权
#   hint - 注入系统提示词的指引文案
# ─────────────────────────────────────────────────────────────
[tool-checker]

[[tool-checker.tools]]
name = "gh-cli"
display = "gh"
check = "gh --version 2>/dev/null | head -1"
auth = "gh auth status"
version = 'gh version (\S+)'
hint = "系统已安装 gh CLI 并且完成密钥配置，有需要应使用该工具（gh 命令）而不是直接调用 GitHub API。"

[[tool-checker.tools]]
name = "uv"
display = "uv"
check = "uv --version"
version = 'uv (\S+)'
hint = "用户已经配置好 uv（Rust 实现的 Python 包管理器）。严格使用 uv 处理所有 Python 包管理操作，包括但不限于：uv pip install（安装包）、uv pip uninstall（卸载）、uv venv（创建虚拟环境）、uv pip list（列出已安装包）、uv pip compile（锁定依赖）。禁止使用 pip 或 python -m pip。安装任何包之前必须先用 uv venv 创建虚拟环境，严禁使用 --system 标志。"

[[tool-checker.tools]]
name = "pnpm"
display = "pn"
check = "pnpm --version"
version = '(\S+)'
hint = "系统已安装 pnpm。在需要安装 npm 包时，优先使用 pnpm（pnpm install / pnpm add / pnpm remove 等），禁止使用 npm 或 yarn。如果项目已有 pnpm-lock.yaml，必须用 pnpm install 而非 npm install。"

# 调试设备互斥：多开 pi 与 subagent 都是独立进程，adb server 全局共享，
# 同一 serial 上并发 install/push/port 会互相踩。设备操作一律过这把 flock。
[[tool-checker.tools]]
name = "device-lock"
display = "lock"
check = "test -x ~/.pi/agent/scripts/with-device-lock.sh && echo ok"
hint = "碰调试设备（adb、串口、烧录器这类独占目标）时，同一台设备上的操作要走 `~/.pi/agent/scripts/with-device-lock.sh <设备标识> -- <命令>` 上锁再执行：多开 pi 与每批 worker 是独立进程，而 adb server 全局共享，同一 serial 上并发 install/push/port 会互相踩。等不到锁（退出码 3）就等一会儿或加 --wait 再试，不要绕开锁直接敲 adb。`--status` 看当前谁占着。"

# ─────────────────────────────────────────────────────────────
# preshell：命令事实层（敏感路径判定与 LLM 预审的事实来源）
# 独立子进程的静态分析器：命令走 stdin，stdout 出 JSON，报出碰了哪些路径、跑了什么程序、
# 哪里看不懂。它不做裁决，策略仍在本仓（lib/sandbox-check.ts）。
# 装：gh release download v0.6.0 -R conglinyizhi/preshell -D /tmp/p && sha256sum -c /tmp/p/SHA256SUMS
#     install -Dm755 /tmp/p/preshell-v0.6.0-x86_64-linux ~/.pi/runtime/preshell
# 拿不到报告（缺二进制/超时/坏 JSON/缺契约项）时按旧的 token 兜底走，不静默放行：
# TUI 提醒一次（附上面的安装命令），状态栏常驻 ✗。熔断分两档：缺件/缺能力一次就断，
# 瞬时失败（超时/坏 JSON/非零退出）连续 5 次才断。
# 可用性看能力不看版本号：启动时起一次 `preshell --spec`，只查 lib/preshell.ts 的
# REQUIRED_CAPABILITIES 那份清单里每一项在不在（字段在就能用，上游加功能不用改本仓）。
# 缺项、或二进制不认识 --spec（v0.4.0 之前）→ 判不可用，退回旧匹配。
# v0.3.0 起 --cwd 事实上必填（单条与流式都是进程级参数），调用方的 ctx.cwd 由 lib/preshell.ts 传；
# 词首带变量/~/~+ 的路径也由那边用环境变量收尾成绝对路径（拿不到确定值就保留原值）。
# ─────────────────────────────────────────────────────────────
[preshell]
enabled = true
bin = "~/.pi/runtime/preshell"
# 实测分析 5µs/命令、起进程约 2ms、本机最大命令 22KB 对应几毫秒，所以 100ms 是十几倍余量
# 定这么小的真正收益在坏情况：二进制卡住时每条命令的阻塞从 2s 降到 100ms
timeoutMs = 100
# 推荐版本：装的时候建议装哪个（开箱即用，与 pi 侧适配过的契约面对齐）。
# 它**不参与任何判定**：可用性由运行时能力探测（--spec 查 REQUIRED_CAPABILITIES）决定，
# 比它新或旧的版本只要能过能力探测一样直接用。这个值只进提示、报告与安装命令。
version = "0.6.0"

# ─────────────────────────────────────────────────────────────
# subagent：派工前的内存闸
# worker 的内存墙是「每条命令」1GiB（sandbox-shell 的默认），并发安全阀只数 worker 个数，
# 两者叠起来能把桌面机推进交换。派工前读 MemAvailable，按下面的两个数算实际并行上限，
# 超出的 worker 留在排队并在回报里写明依据。缺省值偏保守；缺失/写坏按缺省走。
# ─────────────────────────────────────────────────────────────
[subagent-memory]
# 留给桌面与主 agent 的保留量（MB）：可用内存扣掉它之后才拿来开 worker
reserveMb = 2048
# 每个 worker 的典型占用计划值（MB）。这是典型值，不是命令墙（墙上限仍是 1GiB）
planMb = 512

# ─────────────────────────────────────────────────────────────
# sandbox-permissions：gate 危险命令的 LLM 预审
# ─────────────────────────────────────────────────────────────
[sandbox-llm-review]
enabled = true # 总开关；false = 回到纯规则弹窗流程
mode = "auto"  # auto=判安全直接放行；strict=仅给意见仍弹窗
backend = "chat" # chat=对话模型出 verdict（旧路径）；classifier=分类模型出维度答案（见下段）
# 审核模型池独立存放于 extensions/sandbox-permissions/review-pool.toml（个人依赖，已 gitignore）；
# 用 /provider:fast-put / /provider:fast-pop 管理
timeout_ms = 30000 # 注册模型单次审核总时长兜底（毫秒）；超时切换下一个模型
token_idle_ms = 4000 # 免费模型相邻 token 间隔上限（毫秒）；停滞超阈值判失败
max_cache = 200 # 内存缓存上限（同命令同规则不重复调 API）

# ─────────────────────────────────────────────────────────────
# sandbox-review-classifier：分类模型审核后端（[sandbox-llm-review] backend = "classifier" 时生效）
# 一次请求问八个原子问题，拿回类型化答案 + 概率，由下面的阈值决定「要不要提示用户」。
# 硬约束：分类器是试验品，action 只有 review / ignore，**不允许直接拒绝任何请求**。
# API key 从环境变量读：TYPESAFE_API_KEY 或 SILICONFLOW_API_KEY（不写进本文件）。
#   above = 风险值高于它提示（choice 取高风险档概率之和；score 线性归一化；noul 取「是」的概率）
#   below = 置信度低于它提示（noul 没有置信度，该字段无效）
# 面板：/sandbox:review 可视化调阈值（默认 0.5，慢慢调）
# ─────────────────────────────────────────────────────────────
[sandbox-review-classifier]
base_url = "https://api.siliconflow.cn"
# 模型选型（2026-09-30 实测，6 组命令 × 3 模型）：
#   diffusiongemma  判定准（4/4 符合预期）、注入抵抗过、1.8-4.3s、out 56 tok  ← 用这个
#   Kev-4b          快（0.3s）但误报严重：`git status` 判 intent=0.83 unrelated，会把每条命令都弹出来
#   SemIf           同样误报（`git status` → intent=0.73、preshell=0.62 blind-spots）
# 注意：diffusiongemma 的 confidence 恒为 1.0，所以各维度的 below 阈值实际不生效（面板上看得见）。
model = "diffusiongemma"
timeout_ms = 3000
# 维度阈值已移到独立文件 extensions/sandbox-permissions/review-dimensions.toml
# （/sandbox:review 面板要整文件重写它，不拿本文件冒险）
